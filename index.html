<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0E2E">
<title>YW's Archive</title>
<meta name="description" content="웹으로 영상적 경험을 만드는 사람의 아카이브.">
<meta property="og:title" content="YW's Archive">
<meta property="og:description" content="웹으로 영상적 경험을 만드는 사람의 아카이브.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0E2E'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-weight='700' font-size='19' fill='%23C6FF4A' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  /* design.md 3.1 팔레트 (딥 사이버 & 네온) — 8색 */
  --bg:      #0B0E2E;
  --surface: #171A45;
  --text:    #F1EEFA;
  --text-sub:#A6A3D1;
  --border:  #34386E;
  --lime:    #C6FF4A;
  --pink:    #FF3FA4;
  --cyan:    #33E1FF;

  --font-title: 'Space Grotesk', sans-serif;
  --font-body:  'Noto Sans KR', sans-serif;
}

* , *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* 배경 파티클 캔버스 — design.md 5.3 "격자" 규칙의 동적 버전.
   사진·영상이 아닌 canvas 코드로만 그린다. */
#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}

.glow {
  position: fixed;
  left: 50%;
  top: 42%;
  width: 900px;
  height: 900px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(51,225,255,0.12) 0%, rgba(11,14,46,0) 60%);
  pointer-events: none;
  z-index: 1;
}

.intro {
  position: relative;
  z-index: 2;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 20px;
  opacity: 0;
  animation: fade-in 0.3s ease-out forwards;
}

@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.intro__title {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: clamp(40px, 8vw, 56px);
  line-height: 1.3;
  letter-spacing: 0.01em;
  margin: 0 0 16px;
  color: var(--text);
  /* design.md 4.3 — 제목 글로우는 한 색만, 사이버 블루 사용 */
  text-shadow: 0 0 18px rgba(51,225,255,0.35), 0 0 40px rgba(51,225,255,0.15);
}

.intro__title .ch {
  display: inline-block;
  will-change: transform;
}

.intro__tagline {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text-sub);
  margin: 0 0 40px;
}

/* ENTER 버튼 — design.md 5.2 입체 베벨 + 6.1 라임 채움 */
.enter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 32px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--bg);
  text-decoration: none;
  background-color: var(--lime);
  border-radius: 8px;
  border-top: 1px solid #E4FFA0;
  border-left: 1px solid #E4FFA0;
  border-bottom: 1px solid #6E8B22;
  border-right: 1px solid #6E8B22;
  cursor: pointer;
  transition: background-color 0.2s ease-out, transform 0.2s ease-out;
  animation: pulse-glow 3.4s ease-in-out infinite;
}

/* 앰비언트 루프 — design.md 7.2: 2~4초 주기, 초당 3회 미만 */
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 12px rgba(198,255,74,0.25); }
  50%      { box-shadow: 0 0 22px rgba(198,255,74,0.5); }
}

.enter:hover {
  background-color: #D4FF74;
  transform: translateY(-1px);
}

.enter:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.intro--leaving {
  transition: opacity 0.3s ease-out;
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  .intro { animation: none; opacity: 1; }
  .intro--leaving { transition: none; }
  .enter { animation: none; transition: none; }
  .enter:hover { transform: none; }
}
</style>
</head>

<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main class="intro" id="intro">
  <h1 class="intro__title" id="title">YW's Archive</h1>
  <p class="intro__tagline">다양한 포트폴리오를 담고 있습니다.</p>
  <a class="enter" id="enterBtn" href="projects.html">Enter</a>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pointerFine = window.matchMedia('(pointer: fine)').matches;

  /* ============================================================
     파티클 네트워크 — design.md 5.3 "격자"의 동적 버전.
     네온 3색(라임/핑크/사이버 블루)만 사용, 사이버 블루 위주.
     ============================================================ */
  var COUNT      = 160;
  var LINK_DIST  = 118;
  var MOUSE_DIST = 150;
  var PUSH       = 0.9;
  var DRIFT      = 0.22;

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var particles = [];
  var mouse = { x: -9999, y: -9999, active: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function pickHue() {
    var r = Math.random();
    if (r < 0.7) return 'cyan';
    if (r < 0.85) return 'lime';
    return 'pink';
  }

  function build() {
    particles.length = 0;
    for (var i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * DRIFT,
        vy: (Math.random() - 0.5) * DRIFT,
        r: Math.random() * 1.4 + 0.6,
        hue: pickHue()
      });
    }
  }

  function dotColor(hue) {
    if (hue === 'lime') return 'rgba(198,255,74,0.75)';
    if (hue === 'pink') return 'rgba(255,63,164,0.75)';
    return 'rgba(51,225,255,0.75)';
  }

  function step() {
    ctx.clearRect(0, 0, W, H);

    var i, j, p, q, dx, dy, dist;

    for (i = 0; i < particles.length; i++) {
      p = particles[i];

      if (mouse.active) {
        dx = p.x - mouse.x;
        dy = p.y - mouse.y;
        dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_DIST && dist > 0.01) {
          var force = (MOUSE_DIST - dist) / MOUSE_DIST;
          p.vx += (dx / dist) * force * PUSH;
          p.vy += (dy / dist) * force * PUSH;
        }
      }

      p.vx *= 0.94;
      p.vy *= 0.94;

      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp < DRIFT * 0.5) {
        var a = Math.random() * Math.PI * 2;
        p.vx += Math.cos(a) * 0.02;
        p.vy += Math.sin(a) * 0.02;
      }

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      if (p.y > H + 20) p.y = -20;
    }

    /* 연결선 — 사이버 블루, 아주 옅게 (design.md 5.3 opacity 규칙 준용) */
    ctx.lineWidth = 0.6;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      for (j = i + 1; j < particles.length; j++) {
        q = particles[j];
        dx = p.x - q.x;
        dy = p.y - q.y;

        if (dx > LINK_DIST || dx < -LINK_DIST || dy > LINK_DIST || dy < -LINK_DIST) continue;

        dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          var alpha = (1 - dist / LINK_DIST) * 0.22;
          ctx.strokeStyle = 'rgba(51,225,255,' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = dotColor(p.hue);
      ctx.fill();
    }

    requestAnimationFrame(step);
  }

  /* 포인터 반응은 정밀 포인터(마우스/트랙패드)에서만 — 터치·키보드는 배경만 떠다닌다 */
  if (pointerFine) {
    window.addEventListener('pointermove', function (e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    }, { passive: true });

    window.addEventListener('pointerleave', function () {
      mouse.active = false;
    });
  }

  window.addEventListener('resize', function () {
    resize();
    build();
  });

  resize();
  build();

  if (reduced) {
    (function drawOnce() {
      var saved = requestAnimationFrame;
      window.requestAnimationFrame = function () {};
      step();
      window.requestAnimationFrame = saved;
    })();
  } else {
    step();
  }

  /* ============================================================
     제목 — 한 글자씩 분리 (마그네틱 준비 단계)
     ============================================================ */
  var titleEl = document.getElementById('title');
  var titleText = titleEl.textContent.trim();
  var chars = [];

  titleEl.textContent = '';
  for (var c = 0; c < titleText.length; c++) {
    var span = document.createElement('span');
    span.className = 'ch';
    span.textContent = titleText[c] === ' ' ? ' ' : titleText[c];
    titleEl.appendChild(span);
    chars.push({
      el: span,
      xTo: gsap.quickTo(span, 'x', { duration: 0.3, ease: 'power3.out' }),
      yTo: gsap.quickTo(span, 'y', { duration: 0.3, ease: 'power3.out' })
    });
  }

  var charCenters = [];
  function cacheCharCenters() {
    charCenters = chars.map(function (ch) {
      var px = gsap.getProperty(ch.el, 'x');
      var py = gsap.getProperty(ch.el, 'y');
      gsap.set(ch.el, { x: 0, y: 0 });
      var r = ch.el.getBoundingClientRect();
      gsap.set(ch.el, { x: px, y: py });
      return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    });
  }

  /* ============================================================
     등장 애니메이션
     ============================================================ */
  var els = ['#title', '.intro__tagline', '#enterBtn'];

  if (reduced) {
    gsap.set(els, { opacity: 1, y: 0 });
    cacheCharCenters();
  } else {
    gsap.set(els, { opacity: 0, y: 16 });

    var tl = gsap.timeline({
      defaults: { ease: 'power3.out' },
      onComplete: cacheCharCenters
    });

    tl.to('#title',          { opacity: 1, y: 0, duration: 0.3 })
      .to('.intro__tagline', { opacity: 1, y: 0, duration: 0.3 }, '-=0.15')
      .to('#enterBtn',       { opacity: 1, y: 0, duration: 0.3 }, '-=0.15');
  }

  /* ============================================================
     마그네틱 — design.md 7.2: 최대 8px, 정밀 포인터에서만
     ============================================================ */
  var MAG_RADIUS = 130;
  var MAG_PULL   = 0.42;
  var MAG_MAX    = 8;

  if (!reduced && pointerFine) {
    window.addEventListener('pointermove', function (e) {
      if (!charCenters.length) return;

      for (var k = 0; k < chars.length; k++) {
        var ctr = charCenters[k];
        var dx = e.clientX - ctr.cx;
        var dy = e.clientY - ctr.cy;
        var d = Math.sqrt(dx * dx + dy * dy);

        if (d < MAG_RADIUS) {
          var f = (1 - d / MAG_RADIUS) * MAG_PULL;
          var ox = dx * f;
          var oy = dy * f;
          var mag = Math.sqrt(ox * ox + oy * oy);
          if (mag > MAG_MAX) {
            var scale = MAG_MAX / mag;
            ox *= scale;
            oy *= scale;
          }
          chars[k].xTo(ox);
          chars[k].yTo(oy);
        } else {
          chars[k].xTo(0);
          chars[k].yTo(0);
        }
      }
    }, { passive: true });

    window.addEventListener('pointerleave', function () {
      for (var k = 0; k < chars.length; k++) {
        chars[k].xTo(0);
        chars[k].yTo(0);
      }
    });
  }

  window.addEventListener('resize', cacheCharCenters);

  /* ============================================================
     ENTER → projects.html, 0.3초 페이드 전환
     ============================================================ */
  var intro = document.getElementById('intro');
  var enterBtn = document.getElementById('enterBtn');

  enterBtn.addEventListener('click', function (e) {
    if (reduced) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;

    e.preventDefault();
    var href = this.getAttribute('href');

    intro.classList.add('intro--leaving');
    window.setTimeout(function () {
      window.location.href = href;
    }, 300);
  });
})();
</script>
</body>
</html>
