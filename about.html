<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0E2E">
<title>About — YW's Archive</title>
<meta name="description" content="조예원. 웹으로 영상적 경험을 만드는 사람의 소개.">
<meta property="og:title" content="About — YW's Archive">
<meta property="og:description" content="조예원. 웹으로 영상적 경험을 만드는 사람의 소개.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0E2E'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-weight='700' font-size='19' fill='%23C6FF4A' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  /* design.md 3.1 팔레트 (딥 사이버 & 네온) — 8색, index.html / projects.html과 동일 */
  --bg:      #0B0E2E;
  --surface: #171A45;
  --text:    #F1EEFA;
  --text-sub:#A6A3D1;
  --border:  #34386E;
  --lime:    #C6FF4A;
  --pink:    #FF3FA4;
  --cyan:    #33E1FF;

  --font-title: 'Space Grotesk', sans-serif;
  --font-body:  'Noto Sans KR', sans-serif;
}

* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  overflow-x: hidden;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* design.md 6.4 — About은 카드·모달보다 장식을 절제한다. 격자·글로우 없이 배경색만 사용 */

.page {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 40px 80px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0 40px;
  opacity: 0;
  animation: fade-in 0.3s ease-out forwards;
}

@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.brand {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 20px;
  color: var(--text);
  text-decoration: none;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}

.nav-link {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  color: var(--lime);
  text-decoration: underline;
  text-underline-offset: 4px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  transition: text-decoration-thickness 0.2s ease-out;
}

.nav-link:hover { text-decoration-thickness: 2px; }

.brand:focus-visible,
.nav-link:focus-visible,
.contact-link:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

/* 본문 — design.md 6.4: 최대 680px, 왼쪽 정렬 */
.about {
  max-width: 680px;
  opacity: 0;
  animation: fade-in 0.3s ease-out forwards;
  animation-delay: 0.05s;
}

.about__title {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 28px;
  line-height: 1.3;
  color: var(--text);
  margin: 0 0 40px;
}

.about__name {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 20px;
  line-height: 1.3;
  color: var(--text);
  margin: 0 0 16px;
}

.about p {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  margin: 0 0 24px;
}

.about p:last-child { margin-bottom: 0; }

.about__section {
  margin: 40px 0 0;
  padding-top: 40px;
  border-top: 1px solid var(--border);
}

.about__label {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-sub);
  margin: 0 0 16px;
}

.contact-link {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  color: var(--lime);
  text-decoration: underline;
  text-underline-offset: 4px;
  transition: text-decoration-thickness 0.2s ease-out;
}

.contact-link:hover { text-decoration-thickness: 2px; }

@media (prefers-reduced-motion: reduce) {
  .topbar, .about {
    animation: none !important;
    opacity: 1 !important;
  }
  .nav-link, .contact-link { transition: none; }
}

@media (max-width: 767px) {
  .page { padding-left: 20px; padding-right: 20px; }
}

@media (max-width: 1024px) and (min-width: 768px) {
  .page { padding-left: 32px; padding-right: 32px; }
}
</style>
</head>

<body>

<div class="page">
  <header class="topbar">
    <a class="brand" href="index.html">YW's Archive</a>
    <a class="nav-link" href="projects.html">Projects</a>
  </header>

  <main class="about">
    <h1 class="about__title">About</h1>

    <p class="about__name">조예원</p>

    <p>웹으로 영상적 경험을 만드는 작업을 하고 있습니다. 장면과 이야기를 어떻게 화면 위에서 움직이게 할지에 관심이 있습니다.</p>

    <p>매달 영화 리뷰 기사를 쓰고, 소설과 시놉시스도 써봤습니다. 글로 먼저 정리한 장면과 이야기를 다시 웹과 영상으로 옮기는 작업을 이 아카이브에 쌓아가고 있습니다.</p>

    <section class="about__section">
      <p class="about__label">Contact</p>
      <a class="contact-link" href="mailto:yewon021075@gmail.com">yewon021075@gmail.com</a>
    </section>
  </main>
</div>

</body>
</html>
